name: Send Random Telegram Message

on:
  schedule:
    # بيشتغل كل ساعة، والكود بايثون هو اللي بيقرر يبعت ولا لأ
    # حسب توقيت القاهرة الفعلي (بيتظبط تلقائيًا صيفي/شتوي)
    - cron: '0 * * * *'
  workflow_dispatch:      # السطر ده بيسمح لك تشغل البوت يدويًا في أي وقت للتجربة

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Script
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        CHAT_ID: ${{ secrets.CHAT_ID }}
      run: python main.py
